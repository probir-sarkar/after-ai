<!doctype html>
<!-- Source for public/apple-touch-icon.png, rendered at 180x180 via `npm run assets`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; }
      body {
        width: 180px;
        height: 180px;
        background: #08080a;
        display: grid;
        place-items: center;
      }
      .mark { display: flex; gap: 10px; align-items: flex-end; height: 88px; }
      .mark i { display: block; width: 20px; border-radius: 5px; }
      .mark i:nth-child(1) { height: 36px; background: #6ee7b7; }
      .mark i:nth-child(2) { height: 60px; background: #8ab4ff; }
      .mark i:nth-child(3) { height: 88px; background: #dcf26e; }
    </style>
  </head>
  <body>
    <div class="mark"><i></i><i></i><i></i></div>
  </body>
</html>
